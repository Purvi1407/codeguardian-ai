name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rule-engine-tests:
    name: Rule engine + AI validation tests (Python + JS/TS + AI, all mocked)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v \
            --cov=app.analyzer \
            --cov=app.parser \
            --cov=app.ai \
            --cov=app.api \
            --cov=app.services \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend-logic-tests:
    name: Frontend pure-logic tests (Node, no DOM)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run pure-logic tests extracted from app/static/index.html
        working-directory: backend
        run: node --test tests/frontend/pure_logic.test.js
