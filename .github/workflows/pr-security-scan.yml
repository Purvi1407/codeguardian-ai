name: PR Security Scan

# Phase 8 (CI/CD & Integration, items 68-69): a worked example of using
# app/cli.py in a real GitHub Actions PR check — scans only files
# changed in the PR (not the whole repo), uploads results as SARIF so
# they show up natively on GitHub's Security tab and inline on the PR
# diff, and fails the check if a high-severity finding is introduced.
#
# This is deliberately dogfooded on THIS project's own `backend/`
# directory rather than being a separate example repo — the CLI it's
# calling is the same one documented in the "Phase 8" README section,
# with no server, no API key, and no network clone step required (the
# code is already checked out by actions/checkout).

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/**"

permissions:
  contents: read
  security-events: write  # required to upload SARIF to the Security tab
  pull-requests: read     # required to resolve the PR's base ref for the diff

jobs:
  security-scan:
    name: Security scan (changed files only)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed so `git diff` against the base ref works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run CodeGuardian on changed files
        id: scan
        working-directory: backend
        # continue-on-error so the job doesn't stop here if the security
        # gate below trips (exit 1) — SARIF still needs to get uploaded
        # either way, so reviewers can see what failed and why, not just
        # a red X with no detail. The actual pass/fail decision for the
        # PR check happens in the last step, based on this step's outcome.
        continue-on-error: true
        run: |
          python -m app.cli \
            --path . \
            --changed-only \
            --base-ref "origin/${{ github.base_ref }}" \
            --format sarif \
            --output codeguardian-results.sarif \
            --fail-on high

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/codeguardian-results.sarif

      - name: Enforce security gate
        if: steps.scan.outcome == 'failure'
        run: |
          echo "One or more high-severity findings were introduced in this PR's changed files."
          echo "See the Security tab or the annotations on this PR's diff for details."
          exit 1
